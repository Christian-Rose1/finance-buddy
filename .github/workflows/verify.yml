name: Verify pull request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, type-check, build, and inspect whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

      - name: Reject whitespace errors in the reviewed diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Reject whitespace errors in the pushed commit
        if: github.event_name == 'push'
        run: git diff --check HEAD^ HEAD
